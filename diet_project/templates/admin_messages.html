<!DOCTYPE html>
<html>

<head>

<title>Admin Messages</title>

<link rel="stylesheet" href="/static/css/style.css">

<style>

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background-color: #4CAF50;
    color: white;
}

textarea {
    width: 90%;
    height: 60px;
    padding: 5px;
}

button {
    padding: 6px 12px;
    margin-top: 5px;
}

</style>

</head>

<body class="message-page">
<div class="food-background">

<span class="food">🍎</span>
<span class="food">🥕</span>
<span class="food">🥗</span>
<span class="food">🍉</span>
<span class="food">🥑</span>
<span class="food">🍓</span>
<span class="food">🍌</span>
<span class="food">🍇</span>
<span class="food">🥒</span>
<span class="food">🍍</span>

</div>

<div class="container">

<h1>📩 User Messages</h1>

<table>

<tr>

<th>ID</th>
<th>Sender</th>
<th>Message</th>
<th>Reply</th>

</tr>

{% for msg in messages %}

<tr>

<td>{{ msg.id }}</td>

<td>{{ msg.sender }}</td>

<td>{{ msg.message }}</td>

<td>

{% if msg.reply %}

{{ msg.reply }}

{% else %}

<form action="/reply/{{ msg.id }}" method="POST">

<textarea
name="reply"
placeholder="Type reply here"
required></textarea>

<br>

<button type="submit">

Send Reply

</button>

</form>

{% endif %}

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/admin">

<button>

⬅ Back to Admin

</button>

</a>

</div>

</body>

</html>
